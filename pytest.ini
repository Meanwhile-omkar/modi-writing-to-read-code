[pytest]
# Unit tests live in tests/. Other folders hold notebook helpers and experiment scripts that need the full
# dataset (e.g. notebooks/lr05/test_segmentation_equivalence.py) and are run by hand, not by pytest.
testpaths = tests
# pandas imports an old pytz from the global site-packages; its datetime deprecation warning is not ours
filterwarnings =
    ignore::DeprecationWarning:pytz
